[package]
name = "certified-copy"
version = "0.1.0"
description = "Local Windows utility for creating certified document copies."
authors = ["Certified Copy"]
edition = "2021"

[lib]
name = "certified_copy_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "certified-copy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
ttf-parser = "0.25"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
