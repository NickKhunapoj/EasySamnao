[package]
name = "easysamnao"
version = "0.3.0"
description = "Local Windows utility for preparing document copies."
authors = ["NickKhunapoj"]
edition = "2021"

[lib]
name = "easysamnao_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "easysamnao"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
ttf-parser = "0.25"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zeroize = "1.8.1"
