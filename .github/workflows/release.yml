name: Release EasySamnao

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version-check:
    name: Validate release version
    runs-on: windows-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Validate version and detect a version change
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $tauriVersion) {
            throw "package.json ($packageVersion) and src-tauri/tauri.conf.json ($tauriVersion) must use the same version."
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "should_release=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $previousSha = "${{ github.event.before }}"
          if ([string]::IsNullOrWhiteSpace($previousSha) -or $previousSha -match "^0+$") {
            "should_release=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $previousPackage = (git show "$($previousSha):package.json" | Out-String) | ConvertFrom-Json
          $previousTauri = (git show "$($previousSha):src-tauri/tauri.conf.json" | Out-String) | ConvertFrom-Json
          $versionChanged = $packageVersion -ne $previousPackage.version -or $tauriVersion -ne $previousTauri.version
          "should_release=$($versionChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    needs: version-check
    if: github.event_name == 'workflow_dispatch' || needs.version-check.outputs.should_release == 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read Rust compiler version
        id: rust-version
        shell: pwsh
        run: |
          $release = (rustc -Vv | Where-Object { $_ -like "release:*" }).Replace("release: ", "")
          "release=$release" >> $env:GITHUB_OUTPUT

      - name: Cache Rust dependencies and build artifacts
        id: rust-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ steps.rust-version.outputs.release }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ steps.rust-version.outputs.release }}-

      - name: Report Rust cache status
        shell: pwsh
        run: Write-Host "Exact Rust cache hit: ${{ steps.rust-cache.outputs.cache-hit }}"

      - name: Install dependencies
        run: npm ci

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $tauriVersion) {
            throw "package.json ($packageVersion) and src-tauri/tauri.conf.json ($tauriVersion) must use the same version."
          }
          "version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Require a new version
        uses: actions/github-script@v8
        with:
          script: |
            const tag = `v${{ steps.version.outputs.version }}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.setFailed(`Release ${tag} already exists. Increase the version before merging to main.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: EasySamnao v__VERSION__
          releaseBody: Download the Windows installer below.
          releaseDraft: false
          prerelease: false
          args: --bundles msi,nsis
          releaseAssetNamePattern: EasySamnao_[platform]_[arch][setup].[ext]
