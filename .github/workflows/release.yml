name: Release EasySamnao

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $tauriVersion) {
            throw "package.json ($packageVersion) and src-tauri/tauri.conf.json ($tauriVersion) must use the same version."
          }
          "version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Require a new version
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ steps.version.outputs.version }}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.setFailed(`Release ${tag} already exists. Increase the version before merging to main.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: EasySamnao v__VERSION__
          releaseBody: Download the Windows installer below.
          releaseDraft: false
          prerelease: false
          args: --bundles msi,nsis
          releaseAssetNamePattern: EasySamnao_[version]_[platform]_[arch][setup].[ext]
